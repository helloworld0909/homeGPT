server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape vLLM logs from local files
  - job_name: vllm-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: vllm
          __path__: /var/log/vllm/*/vllm-server.log.*
    pipeline_stages:
      - match:
          selector: '{job="vllm"}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\S+)\s+(?P<level>\S+)\s+(?P<message>.*)$'
            - labels:
                level:
            - timestamp:
                source: timestamp
                format: RFC3339

  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=home-gpt"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
