services:
  webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # Model Manager proxy endpoint (handles all models)
      - OPENAI_API_BASE_URLS=http://model-manager:9000/v1
      - OPENAI_API_KEYS=dummy
      # Model Manager for hot-swapping
      - MODEL_MANAGER_URL=http://model-manager:9000
      # Enable model filtering
      - ENABLE_MODEL_FILTER=true
      # WebUI configuration
      - WEBUI_NAME=homeGPT
      - DEFAULT_USER_ROLE=admin
    networks:
      - homegpt-network

volumes:
  open-webui:
    name: open-webui
